{% extends 'base.html' %}
{% block content %}
<div class="card"><h2>图书管理</h2><a href="/dashboard/books/new/">新增图书</a>
<table><tr><th>书名</th><th>作者</th><th>分类</th><th>操作</th></tr>{% for b in books %}<tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.category }}</td><td><a href="/dashboard/books/{{ b.id }}/edit/">编辑</a><form method="post" action="/dashboard/books/{{ b.id }}/delete/" style="display:inline-block;margin-left:8px;">{% csrf_token %}<button type="submit" style="width:auto;padding:6px 10px;margin:0;">删除</button></form></td></tr>{% endfor %}</table>
</div>
{% endblock %}

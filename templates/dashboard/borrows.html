{% extends 'base.html' %}
{% block content %}
<div class="card"><h2>借阅管理</h2>
<table><tr><th>用户</th><th>图书</th><th>状态</th><th>借阅时间</th><th>到期</th></tr>{% for b in borrows %}<tr><td>{{ b.user.username }}</td><td>{{ b.book.title }}</td><td>{{ b.get_status_display }}</td><td>{{ b.borrowed_at|date:'Y-m-d' }}</td><td>{{ b.due_date|date:'Y-m-d' }}</td></tr>{% endfor %}</table>
</div>
{% endblock %}

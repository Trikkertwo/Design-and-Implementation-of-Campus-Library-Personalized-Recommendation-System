{% extends 'base.html' %}

<div class="card"><a href="/dashboard/books/">图书管理</a> | <a href="/dashboard/users/">用户管理</a> | <a href="/dashboard/borrows/">借阅管理</a> | <a href="/dashboard/comments/">评论管理</a></div>

{% extends 'base.html' %}
{% block content %}
<div class="card">
<h2>图书检索</h2>
<form class="filters" method="get">
    <input name="keyword" placeholder="书名" value="{{ query.keyword }}">
    <input name="author" placeholder="作者" value="{{ query.author }}">
    <input name="isbn" placeholder="ISBN" value="{{ query.isbn }}">
    <input name="category" placeholder="分类" value="{{ query.category }}">
    <button class="btn-primary" type="submit">检索</button>
</form>
<table>
    <tr><th>书名</th><th>作者</th><th>ISBN</th><th>分类</th><th>馆藏</th><th></th></tr>
    {% for b in books %}<tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.isbn }}</td><td>{{ b.category }}</td><td>{{ b.available_copies }}/{{ b.total_copies }}</td><td><a href="/books/{{ b.id }}/">详情</a></td></tr>{% empty %}<tr><td colspan="6">无匹配结果</td></tr>{% endfor %}
</table>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="card">
<h2>图书检索</h2>
<form class="filters" method="get">
    <input name="keyword" placeholder="书名" value="{{ query.keyword }}">
    <input name="author" placeholder="作者" value="{{ query.author }}">
    <input name="isbn" placeholder="ISBN" value="{{ query.isbn }}">
    <input name="category" placeholder="分类" value="{{ query.category }}">
    <button class="btn-primary" type="submit">检索</button>
</form>
<div class="book-grid">
    {% for b in books %}
        <article class="book-card">
            <img src="{{ b.cover_url|default:default_book_cover_url }}" alt="{{ b.title }} 封面">
            <div>
                <h3>{{ b.title }}</h3>
                <p class="book-meta">{{ b.author }} · {{ b.category }}</p>
                <p class="book-meta">ISBN: {{ b.isbn }}</p>
                <p>{{ b.summary|default:'暂无简介'|truncatechars:110 }}</p>
                <p class="book-meta">馆藏：{{ b.available_copies }}/{{ b.total_copies }}</p>
                <a class="item" href="/books/{{ b.id }}/">查看详情</a>
            </div>
        </article>
    {% empty %}
        <p>无匹配结果</p>
    {% endfor %}
</div>
</div>
{% endblock %}

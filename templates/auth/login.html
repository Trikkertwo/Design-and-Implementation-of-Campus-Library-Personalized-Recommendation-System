<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园图书推荐系统</title>
    <link rel="stylesheet" href="/static/library/style.css">
</head>
<body class="auth-page">
<div class="auth-wrap modern-auth">
    <section class="auth-panel modern-auth-panel">
        <span class="auth-badge">Campus Library</span>
        <h1>欢迎回来</h1>
        <p>Google 风格的简洁体验，智能推荐你真正需要的书。</p>
        <ul class="auth-points">
            <li>智能推荐：借阅行为 + 收藏偏好 + 评分热度融合</li>
            <li>图书可视化：每本书均展示封面与简介</li>
            <li>快速检索：按书名 / 作者 / ISBN / 分类直达</li>
        </ul>
    </section>
    <section class="auth-card modern-auth-card">
        <h2>账号登录</h2>
        {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
        <form method="post">
            {% csrf_token %}
            <label>用户名{{ form.username }}</label>
            <label>密码{{ form.password }}</label>
            <label>验证码
                <div class="captcha-line">{{ form.captcha }}<strong id="captcha-text">{{ captcha }}</strong><button type="button" id="refresh">换一张</button></div>
            </label>
            <button class="btn-primary" type="submit">登 录</button>
        </form>
        <div class="auth-links">
            <a href="/register/">注册账号</a>
            <a href="/password/reset/">忘记密码</a>
        </div>
    </section>
</div>
<script>
const refreshBtn = document.getElementById('refresh');
refreshBtn?.addEventListener('click', async () => {
    const res = await fetch('/captcha/refresh/');
    const data = await res.json();
    document.getElementById('captcha-text').textContent = data.captcha;
});
</script>
</body>
</html>

{% extends 'base.html' %}
{% block title %}重置密码{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>重置密码</h2>
    <form method="post">
        {% csrf_token %}
        <label>用户名{{ form.username }}</label>
        <label>新密码{{ form.new_password }}</label>
        <label>验证码<div class="captcha-line">{{ form.captcha }}<strong id="captcha-text">{{ captcha }}</strong><button type="button" id="refresh">换一张</button></div></label>
        <button class="btn-primary" type="submit">重置</button>
    </form>
</div>
<script>
document.getElementById('refresh')?.addEventListener('click', async () => {
 const res = await fetch('/captcha/refresh/'); const data = await res.json();
 document.getElementById('captcha-text').textContent = data.captcha;
});
</script>
{% endblock %}
